name: Docker auto updates

on:
  workflow_dispatch:
  schedule:
    - cron: '24 1 * * 1/2'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if base container update available
        id: check
        uses: lucacome/docker-image-update-checker@a9613235d22dc951741aef2b6301da8db05ea5f6 # v3.1.3
        with:
          base-image: debian:trixie-slim
          image: ghcr.io/voxelbonecloud/resonite-headless-docker:main

      - name: Log in to Docker
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: steps.check.outputs.needs-updating == 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.check.outputs.needs-updating == 'true'

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ghcr.io/voxelbonecloud/headless-docker:${{ github.ref_name}}
        if: steps.check.outputs.needs-updating == 'true'
